name: build

# Push to dev  -> build image -> homelab deploys to staging
# Push to main -> build image -> homelab deploys to prod
on:
  push:
    branches: [dev, main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: |
          repo="${{ github.event.repository.name }}"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${repo,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64     # Raspberry Pi + x86 nodes
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref_name == 'dev' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    env:
      # Org-level settings (Settings → Secrets and variables → Actions in the organization)
      HOMELAB_REPO_NAME: ${{ vars.HOMELAB_REPO_NAME || 'homelab' }}
    steps:
      - name: Check deploy app settings
        env:
          APP_ID: ${{ vars.HOMELAB_DEPLOY_APP_ID }}
          APP_KEY_SET: ${{ secrets.HOMELAB_DEPLOY_APP_KEY != '' }}
        run: |
          [ -n "$APP_ID" ] && [ "$APP_KEY_SET" = "true" ] || {
            echo "::error::Org variable HOMELAB_DEPLOY_APP_ID or org secret HOMELAB_DEPLOY_APP_KEY is missing or not shared with this repo"
            exit 1; }
      - name: Get short-lived token from the deploy GitHub App
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.HOMELAB_DEPLOY_APP_ID }}
          private-key: ${{ secrets.HOMELAB_DEPLOY_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.HOMELAB_REPO_NAME }}
      - name: Ask homelab to deploy
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HOMELAB_REPO: ${{ github.repository_owner }}/${{ env.HOMELAB_REPO_NAME }}
          APP: ${{ vars.HOMELAB_APP || github.event.repository.name }}
          TARGET_ENV: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
        run: |
          set -euo pipefail
          APP="${APP,,}"
          gh api "repos/$HOMELAB_REPO/dispatches" \
            -f event_type=deploy \
            -f "client_payload[app]=$APP" \
            -f "client_payload[env]=$TARGET_ENV" \
            -f "client_payload[tag]=$GITHUB_SHA"
          {
            echo "### Deploy requested"
            echo "\`$APP\` → **$TARGET_ENV** at \`${GITHUB_SHA::7}\`"
            echo ""
            echo "Follow it in https://github.com/$HOMELAB_REPO/actions/workflows/deploy.yml"
          } >> "$GITHUB_STEP_SUMMARY"
